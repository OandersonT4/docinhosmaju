<!doctype html>
<!-- Imagens de compartilhamento (pré-visualização do link no WhatsApp, Instagram e Facebook), 1200x630.
     Com o site rodando localmente (python3 -m http.server), abra /docs/og/og.html (Início) ou ?p=bolos, brigadeiros,
     tortas, geladinhos, como-pedir e tire um print de 1200x630. Salve em assets/img/og.jpg (Início) ou og-<página>.jpg
     e aumente o ?v= do og:image da página. Não vai para a VPS. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/assets/fontes/fontes.css?v=1">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: Poppins, sans-serif; background: #F4F0FD; color: #2B2552; }
  .og { display: grid; grid-template-columns: 560px 1fr; height: 100%; }
  .texto { padding: 56px 40px 52px 64px; display: flex; flex-direction: column; }
  .marca { display: flex; align-items: center; gap: 14px; font-family: Pacifico, cursive; font-size: 44px; color: #5B5BD6; }
  .marca img { width: 84px; height: 84px; }
  h1 { margin-top: 44px; font-size: 62px; font-weight: 800; line-height: 1.02; letter-spacing: -.035em; }
  h1 em { display: block; font-family: Lora, serif; font-style: italic; font-weight: 600; color: #5B5BD6; letter-spacing: 0; }
  .rodape { margin-top: auto; display: flex; gap: 12px; flex-wrap: wrap; }
  .chip { padding: 10px 20px; border-radius: 999px; font-weight: 700; font-size: 22px; background: #FBE3EE; }
  .chip.forte { background: #5B5BD6; color: #fff; }
  .fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 28px 28px 28px 0; }
  .fotos img { width: 100%; height: 100%; object-fit: cover; border-radius: 26px; box-shadow: 0 14px 30px rgba(43,37,82,.18); }
  .fotos.uma { grid-template-columns: 1fr; }
  .fotos.uma img { border-radius: 32px; }
  .preco { font-size: 26px; }
</style>
</head>
<body>
<div class="og" id="og"></div>
<script>
var P = {
  inicio: { t: "4 jeitos de matar a", e: "vontade de doce.", chip: "Nova Serrana/MG", fotos: ["bolos", "brigadeiros", "tortas", "geladinhos"] },
  bolos: { t: "Bolo de fatia", e: "no potinho.", chip: "R$ 12 o potinho", fotos: ["bolos"] },
  brigadeiros: { t: "Caixinha com", e: "4 brigadeiros.", chip: "R$ 12 a caixinha", fotos: ["brigadeiros"] },
  tortas: { t: "Tortinha", e: "individual.", chip: "R$ 10 a tortinha", fotos: ["tortas"] },
  geladinhos: { t: "Geladinho", e: "cremoso.", chip: "R$ 5 cada", fotos: ["geladinhos"] },
  "como-pedir": { t: "Monte o pedido.", e: "Chega pronto no WhatsApp.", chip: "Entrega grátis a partir de R$ 40", fotos: ["bolos", "brigadeiros", "tortas", "geladinhos"] }
};
var p = P[new URLSearchParams(location.search).get("p")] || P.inicio;
document.getElementById("og").innerHTML =
  '<div class="texto"><div class="marca"><img src="/assets/img/logo.png" alt="">Doce Maju</div>' +
  "<h1>" + p.t + " <em>" + p.e + "</em></h1>" +
  '<div class="rodape"><span class="chip' + (p.fotos.length === 1 ? " preco" : "") + '">' + p.chip + '</span><span class="chip forte">docinhosmaju.com.br</span></div></div>' +
  '<div class="fotos' + (p.fotos.length === 1 ? " uma" : "") + '">' + p.fotos.map(function (f) { return '<img src="/assets/img/' + f + '.jpg" alt="">'; }).join("") + "</div>";
</script>
</body>
</html>
